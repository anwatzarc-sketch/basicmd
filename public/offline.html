<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>You're offline</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif;
    background: #f8fafc;
    color: #0f172a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1720; color: #e2e8f0; }
    .card { background: #141e2a; border-color: #263241; }
    .btn { background: #35c9c0; color: #06201d; }
  }
  .card {
    max-width: 380px;
    width: 100%;
    text-align: center;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    padding: 40px 28px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
  }
  .badge {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, #0f8f89, #063b3a);
    display: grid;
    place-items: center;
  }
  .badge svg { width: 26px; height: 26px; stroke: #fff; }
  h1 { font-size: 19px; font-weight: 800; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.6; color: #64748b; margin: 0 0 24px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #056460;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge" aria-hidden="true">
      <svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M8.5 16.5a5 5 0 017-7M5 13a9 9 0 0114 0M1 9.5a13 13 0 0122 0M12 20h.01"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>This page needs a connection and couldn't be reached. Your booking, patient and billing data always come straight from the server &mdash; nothing here is ever shown from an old copy.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
