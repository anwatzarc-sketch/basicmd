# =====================================================================
#  MediCareMini - nginx server block
#
#  Copy to /etc/nginx/sites-available/medicaremini.radiants.net.et and symlink into
#  sites-enabled. Replace the paths to match your deployment.
#
#  The single most important line in this file is `root`: it points at
#  public/, NOT at the project directory. Everything else - src/, storage/,
#  the .env file, vendor/ - sits above the document root and is therefore
#  unreachable over HTTP no matter what else is misconfigured.
#
#  ---------------------------------------------------------------------
#  THIS FILE ASSUMES TLS.
#
#  It redirects HTTP to HTTPS. If the site is served over plain HTTP, that
#  redirect is an infinite loop and nothing loads. Until a certificate is in
#  place, use deploy/nginx-http-only.conf instead, and set SESSION_SECURE=false
#  in .env to match.
#
#  A booking form collects patient names, phone numbers and symptoms, and the
#  payment flow carries bank receipts. Run this over TLS. certbot issues a free
#  certificate in about a minute:
#
#      certbot --nginx -d medicaremini.radiants.net.et
#  ---------------------------------------------------------------------
# =====================================================================

# --- Rate-limit zones -------------------------------------------------
# Defined at http level. If you already have a conf.d file with limit_req_zone
# directives, move these there instead - a duplicate zone name is a config error.
limit_req_zone $binary_remote_addr zone=medicaremini_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=medicaremini_login:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=medicaremini_booking:10m rate=20r/m;

# --- HTTP: redirect everything to HTTPS -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name medicaremini.radiants.net.et;

    # Leave ACME challenges reachable so certificate renewal keeps working.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Main site --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name medicaremini.radiants.net.et;

    # ---- Document root: public/ only ----
    root /var/www/medicaremini/public;
    index index.php;

    charset utf-8;
    # Ge'ez content needs an explicit charset on text types or some proxies
    # will serve it as ISO-8859-1 and mangle every glyph.
    charset_types text/css text/plain application/javascript application/json application/xml;

    # ---- TLS ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- Uploads ----
    # Must exceed UPLOAD_PROOF_MAX_MB. A patient photographing a bank slip on
    # a modern phone can easily produce a 4-6 MB JPEG.
    client_max_body_size 12M;
    client_body_timeout 60s;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;
    # WebP and woff2 are already compressed; re-compressing wastes CPU.

    # ---- Logging ----
    access_log /var/log/nginx/medicaremini.access.log;
    error_log  /var/log/nginx/medicaremini.error.log warn;

    # =================================================================
    #  Security: block access to anything that is not meant to be served
    # =================================================================

    # Dotfiles, including .env if it were ever copied into public/ by mistake.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Source, config and dependency files, belt-and-braces.
    location ~* \.(env|log|sql|md|lock|json|ya?ml|ini|sh|bak|old|dist)$ {
        deny all;
        return 404;
    }

    # PHP anywhere except the front controller. Combined with the
    # `root public/` above, this makes arbitrary-PHP execution impossible
    # even if an attacker managed to write a .php file into public/.
    location ~* ^/(?!index\.php$).*\.php$ {
        deny all;
        return 404;
    }

    # =================================================================
    #  Static assets
    # =================================================================

    # Built CSS/JS are content-hashed by mtime in the query string, so they
    # can be cached hard.
    location ^~ /dist/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- Uploaded CMS media ----
    # Served straight from disk rather than through PHP. `internal`-free
    # alias is safe here: this directory holds only re-encoded WebP images
    # written by FileUploader, never anything executable.
    #
    # NOTE: payment PROOFS are deliberately NOT exposed this way. They live in
    # storage/uploads/proofs and are streamed only by an authenticated
    # controller, which also writes an audit entry per view.
    location ^~ /media/ {
        alias /var/www/medicaremini/storage/uploads/media/;

        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        # Defence in depth: never let anything here be interpreted as active
        # content, whatever its extension turns out to be.
        add_header Content-Disposition "inline" always;

        # Only image types are served; anything else falls through to PHP,
        # which 404s it.
        location ~* \.(webp|jpe?g|png|svg)$ {
            try_files $uri @app;
        }

        return 404;
    }

    # =================================================================
    #  Application
    # =================================================================

    location = /robots.txt  { try_files $uri @app; access_log off; }
    location = /sitemap.xml { try_files $uri @app; access_log off; }
    location = /favicon.ico { try_files $uri =404; access_log off; log_not_found off; }

    # Tighter rate limit on the sign-in endpoint. The application enforces its
    # own per-account lockout too; this stops the traffic before PHP is
    # involved at all.
    location = /admin/login {
        limit_req zone=medicaremini_login burst=5 nodelay;
        try_files $uri @app;
    }

    location = /book {
        limit_req zone=medicaremini_booking burst=10 nodelay;
        try_files $uri @app;
    }

    location / {
        limit_req zone=medicaremini_general burst=50 nodelay;
        try_files $uri $uri/ @app;
    }

    location @app {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        include fastcgi_params;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        # The app reads this to decide whether the request is secure.
        fastcgi_param HTTPS           on;

        # Proof uploads and slow SMTP make 60s a realistic ceiling.
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Hard stop on PHP executing anything but this file.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $fastcgi_script_name =404;

        # Do not advertise the PHP version.
        fastcgi_hide_header X-Powered-By;
    }

    # The application sets its own CSP, HSTS and Permissions-Policy per
    # request (see SecurityHeaders middleware), so they are not duplicated
    # here - a static header would override the per-request nonce.
}
