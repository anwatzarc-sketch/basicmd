# =====================================================================
#  MediCareMini - nginx server block, PLAIN HTTP
#
#  Use this only until a TLS certificate is in place. It is byte-identical to
#  nginx.conf except that it listens on :80, does not redirect to HTTPS, and
#  does not set HTTPS-only headers.
#
#  Pair it with these in .env:
#      APP_URL=http://medicaremini.radiants.net.et
#      SESSION_SECURE=false
#
#  ---------------------------------------------------------------------
#  Move to TLS as soon as you can, and this file becomes unnecessary.
#
#  Over plain HTTP everything this site handles crosses the network readable
#  by anyone on the path: patient names, phone numbers, the symptoms typed
#  into the booking form, bank receipt images, and staff passwords at sign-in.
#
#      certbot --nginx -d medicaremini.radiants.net.et
#
#  Then switch to nginx.conf and set SESSION_SECURE=true.
#  ---------------------------------------------------------------------
# =====================================================================

limit_req_zone $binary_remote_addr zone=medicaremini_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=medicaremini_login:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=medicaremini_booking:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name medicaremini.radiants.net.et;

    # ---- Document root: public/ only ----
    root /var/www/medicaremini/public;
    index index.php;

    charset utf-8;
    # Ge'ez content needs an explicit charset on text types or some proxies
    # will serve it as ISO-8859-1 and mangle every glyph.
    charset_types text/css text/plain application/javascript application/json application/xml;

    # Must exceed UPLOAD_PROOF_MAX_MB. A patient photographing a bank slip on
    # a modern phone can easily produce a 4-6 MB JPEG.
    client_max_body_size 12M;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    access_log /var/log/nginx/medicaremini.access.log;
    error_log  /var/log/nginx/medicaremini.error.log warn;

    # Keep the ACME path reachable so issuing a certificate later just works.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # =================================================================
    #  Security: block anything not meant to be served
    # =================================================================

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(env|log|sql|md|lock|json|ya?ml|ini|sh|bak|old|dist)$ {
        deny all;
        return 404;
    }

    # PHP anywhere except the front controller.
    location ~* ^/(?!index\.php$).*\.php$ {
        deny all;
        return 404;
    }

    # =================================================================
    #  Static assets
    # =================================================================

    location ^~ /dist/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Uploaded CMS media. Payment PROOFS are deliberately NOT served here -
    # they live in storage/uploads/proofs and are streamed only by an
    # authenticated controller that audits every view.
    location ^~ /media/ {
        alias /var/www/medicaremini/storage/uploads/media/;

        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;

        location ~* \.(webp|jpe?g|png|svg)$ {
            try_files $uri @app;
        }

        return 404;
    }

    # =================================================================
    #  Application
    # =================================================================

    location = /robots.txt  { try_files $uri @app; access_log off; }
    location = /sitemap.xml { try_files $uri @app; access_log off; }
    location = /favicon.ico { try_files $uri =404; access_log off; log_not_found off; }

    location = /admin/login {
        limit_req zone=medicaremini_login burst=5 nodelay;
        try_files $uri @app;
    }

    location = /book {
        limit_req zone=medicaremini_booking burst=10 nodelay;
        try_files $uri @app;
    }

    location / {
        limit_req zone=medicaremini_general burst=50 nodelay;
        try_files $uri $uri/ @app;
    }

    location @app {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        include fastcgi_params;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        # Deliberately NOT setting HTTPS=on here: the app reads it to decide
        # whether the connection is secure, and lying would make it set
        # Secure-only cookies the browser then refuses to send back.

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $fastcgi_script_name =404;

        fastcgi_hide_header X-Powered-By;
    }

    # The application sets CSP and the other security headers per request.
    # It omits upgrade-insecure-requests while APP_URL is http://, which is
    # why this file needs no header overrides.
}
